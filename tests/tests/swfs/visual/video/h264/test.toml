num_ticks = 120

# This 2 FPS video has B-frames, so the order its frames are
# decoded in - which is the order they are stored in - is not
# the order they are shown in:
#
#   decode_time + composition_offset = presentation_time
#      0 + 1000 = 1000
#    500 + 2500 = 3000
#   1000 + 1000 = 2000
#   1500 +    0 = 1500
#   2000 +  500 = 2500
#   2500 + 2500 = 5000
#   3000 + 1000 = 4000
#   3500 +    0 = 3500
#   4000 +  500 = 4500
#
# Presentation therefore runs from 1000 ms to 5000 ms in even
# 500 ms steps, two frames behind the decode timeline, and the
# last frame is due a full second after the last tag in the
# file. The SWF is 20 FPS, so nothing is on screen for the
# first 20 of its frames, and the two checks below confirm
# that rather than skipping over it.

[image_comparisons.frame0]
tolerance = 2
trigger = 5

[image_comparisons.frame1]
tolerance = 2
trigger = 15

[image_comparisons.frame2]
tolerance = 2
trigger = 25

[image_comparisons.frame3]
tolerance = 2
trigger = 35

[image_comparisons.frame4]
tolerance = 2
trigger = 45

[image_comparisons.frame5]
tolerance = 2
trigger = 55

[image_comparisons.frame6]
tolerance = 2
trigger = 65

[image_comparisons.frame7]
tolerance = 2
trigger = 75

[image_comparisons.frame8]
tolerance = 2
trigger = 85

[image_comparisons.frame9]
tolerance = 2
